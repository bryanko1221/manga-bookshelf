<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>我的漫畫書櫃</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">PERSONAL MANGA SHELF</div>
      <h1>我的漫畫書櫃</h1>
      <p>集中管理你的漫畫連結，點擊後前往原網站閱讀。</p>
    </div>
    <button id="themeBtn" class="icon-btn" aria-label="切換深色模式">◐</button>
  </header>

  <main class="container">
    <section class="controls">
      <input id="search" type="search" placeholder="搜尋漫畫名稱…" autocomplete="off">
      <div class="chips">
        <button class="chip active" data-filter="all">全部 <span id="countAll"></span></button>
        <button class="chip" data-filter="favorite">收藏 <span id="countFav"></span></button>
      </div>
    </section>

    <section id="bookshelf" class="grid" aria-live="polite"></section>
    <div id="empty" class="empty hidden">找不到符合條件的漫畫。</div>
  </main>

  <footer>
    <span>共 <b id="footerCount">0</b> 部</span>
    <span>書櫃只保存名稱、閱讀連結與你的閱讀進度，不保存漫畫內容。</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
