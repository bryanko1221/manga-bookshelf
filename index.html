<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>我的漫畫書櫃 V2.4</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header><div class="head"><div><small>MY MANGA LIBRARY</small><h1>我的漫畫書櫃</h1><p>19 部核心書單 · 漫畫封面 · 收藏 · 閱讀紀錄</p></div><button id="theme">☾</button></div></header>
<main>
<div class="stats"><div><b id="total">19</b><span>核心漫畫</span></div><div><b id="favCount">0</b><span>我的收藏</span></div><div><b id="newCount">0</b><span>有更新</span></div></div>
<div class="notice">🖼️ 封面支援：可在編輯漫畫時貼上圖片網址；沒有封面時會使用漂亮的預設封面。</div>
<div class="sectionTitle"><h2>🕘 繼續閱讀</h2><button id="clear">清除</button></div>
<div id="continueList"></div>
<div class="tools"><input id="search" type="search" placeholder="🔍 搜尋漫畫…"><div class="chips"><button class="chip active" data-f="all">全部</button><button class="chip" data-f="fav">⭐ 收藏</button><button class="chip" data-f="new">🆕 有更新</button><select id="category"><option value="all">全部分類</option><option>熱血</option><option>玄幻</option><option>武俠</option><option>重生</option><option>冒險</option></select></div></div>
<div class="sectionTitle"><h2>📚 核心書單</h2><span id="count"></span></div>
<section id="grid"></section><div id="empty" class="empty hidden">找不到漫畫。</div>
</main>
<div id="modal" class="modal hidden"><div class="modalBox">
<div class="modalHead"><h2 id="modalTitle">編輯漫畫</h2><button id="close">×</button></div>
<label>漫畫名稱<input id="titleInput"></label>
<label>漫畫網址<input id="urlInput" type="url"></label>
<label>封面圖片網址<input id="coverInput" type="url" placeholder="https://...jpg / png / webp"></label>
<label>分類<select id="catInput"><option>熱血</option><option>玄幻</option><option>武俠</option><option>重生</option><option>冒險</option></select></label>
<p id="error"></p>
<div class="modalActions"><button id="cancel">取消</button><button id="save">儲存</button></div>
</div></div>
<footer>V2.4 · 核心書單維持 19 部。除非你明確要求，不自行刪除或替換。</footer>
<script src="app.js"></script>
</body></html>
