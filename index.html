<!doctype html><html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes">
<title>我的漫畫書櫃 V2.2</title><link rel="stylesheet" href="styles.css"></head>
<body><header><div class="hero"><div><small>MY MANGA LIBRARY</small><h1>我的漫畫書櫃</h1><p id="heroText">管理漫畫、收藏、閱讀紀錄與封面。</p></div><button id="themeBtn" class="round">☾</button></div></header>
<main><section class="stats"><div><b id="total">0</b><span>漫畫</span></div><div><b id="favTotal">0</b><span>收藏</span></div><div><b id="recentTotal">0</b><span>閱讀紀錄</span></div></section>
<section class="recentSection"><div class="sectionHead"><h2>🕘 繼續閱讀</h2><button id="clearRecent">清除紀錄</button></div><div id="recentList" class="recentList"></div></section>
<section class="toolbar"><input id="search" type="search" placeholder="🔍 搜尋漫畫名稱…"><div class="filters">
<button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="fav">⭐ 收藏</button>
<select id="category"><option value="all">全部分類</option></select><button id="addBtn" class="addBtn">＋ 新增漫畫</button></div></section>
<div class="sectionHead"><h2>📚 我的書櫃</h2><div class="headActions"><span id="resultCount">0 部</span><button id="restoreBtn">↺ 還原19部</button></div></div>
<section id="grid" class="grid"></section><div id="empty" class="empty hidden">找不到符合條件的漫畫。</div></main>
<div id="modal" class="modal hidden"><div class="modalBox"><div class="modalHead"><h2 id="modalTitle">新增漫畫</h2><button id="closeModal">×</button></div>
<label>漫畫名稱<input id="titleInput" type="text" placeholder="例如：我的新漫畫"></label>
<label>漫畫網址<input id="urlInput" type="url" placeholder="https://..."></label>
<label>封面圖片網址<input id="coverInput" type="url" placeholder="https://...jpg / png / webp"></label>
<label>分類<select id="categoryInput"><option>熱血</option><option>玄幻</option><option>武俠</option><option>重生</option><option>冒險</option><option>其他</option></select></label>
<p id="formError" class="formError"></p><div class="modalActions"><button id="cancelBtn" class="cancel">取消</button><button id="saveBtn" class="save">儲存</button></div></div></div>
<footer>V2.2 · 可新增、編輯、刪除漫畫。核心19部可隨時增減；網站只保存書單與連結。</footer>
<script src="app.js"></script></body></html>
