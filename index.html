<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020"><meta name="apple-mobile-web-app-capable" content="yes">
<title>我的漫畫書櫃 V2.2</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="hero"><div class="hero-inner"><div><div class="kicker">MY MANGA LIBRARY</div><h1>我的漫畫書櫃</h1><p>收藏、搜尋、繼續閱讀，手機也能輕鬆管理。</p></div><button id="theme" class="round">☾</button></div></header>
<main>
<section class="continue"><div class="section-title"><h2>🕘 繼續閱讀</h2><button id="clearHistory" class="text-btn">清除紀錄</button></div><div id="continueList" class="continue-list"></div></section>
<section class="toolbar">
<label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜尋漫畫…" autocomplete="off"></label>
<div class="tabs"><button class="tab active" data-filter="all">全部 <b id="allCount"></b></button><button class="tab" data-filter="fav">⭐ 收藏 <b id="favCount"></b></button></div>
<button id="addBtn" class="add">＋ 新增漫畫</button>
</section>
<section><div class="section-title"><h2>📚 我的書櫃</h2><span id="result"></span></div><div id="grid" class="grid"></div><div id="empty" class="empty hidden">找不到符合條件的漫畫。</div></section>
</main>

<div id="modal" class="modal hidden"><div class="modal-box">
<div class="modal-head"><h2 id="modalTitle">新增漫畫</h2><button id="closeModal">×</button></div>
<label>漫畫名稱<input id="titleInput" placeholder="例如：我獨自升級"></label>
<label>漫畫網址<input id="urlInput" type="url" placeholder="https://..."></label>
<label>分類<select id="catInput"><option>未分類</option><option>熱血</option><option>玄幻</option><option>重生</option><option>無敵</option><option>冒險</option><option>其他</option></select></label>
<div class="modal-actions"><button id="cancelBtn" class="secondary">取消</button><button id="saveBtn" class="primary">儲存</button></div>
<p id="modalError" class="error"></p>
</div></div>
<footer>V2.2 · 書櫃只保存名稱、連結、分類與本機閱讀紀錄，不保存第三方漫畫內容。</footer>
<script src="app.js"></script></body></html>
